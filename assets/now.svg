<svg xmlns="http://www.w3.org/2000/svg" width="820" height="130" viewBox="0 0 820 130" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient></defs>
<style>
.m{font-family:'JetBrains Mono',Consolas,'SF Mono',monospace}
.tag{font-size:10px;fill:#8b949e;letter-spacing:2px;font-weight:600}
.l{font-size:14px;fill:#c9d1d9}
.a{font-size:14px;fill:#00e5a0}
.dot{animation:p 1.6s ease-in-out infinite}
.cur{animation:b 1s steps(1) infinite}
.l1,.l2,.l3{opacity:0;animation:in .6s ease forwards}
.l1{animation-delay:.2s}.l2{animation-delay:.5s}.l3{animation-delay:.8s}
@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes b{50%{opacity:0}}
@keyframes in{to{opacity:1}}
</style>
<rect x="2" y="2" width="816" height="126" rx="14" fill="url(#bg)" stroke="#30363d"/>
<circle class="dot" cx="34" cy="34" r="5" fill="#00e5a0"/>
<text x="48" y="39" class="m tag">CURRENTLY</text>
<g class="l1"><text x="30" y="68" class="m a">&gt;</text><text x="50" y="68" class="m l">data structures &amp; algorithms, daily</text></g>
<g class="l2"><text x="30" y="90" class="m a">&gt;</text><text x="50" y="90" class="m l">LLM agents and evaluation</text></g>
<g class="l3"><text x="30" y="112" class="m a">&gt;</text><text x="50" y="112" class="m l">reading other people's code<tspan class="cur" fill="#00e5a0"> &#9613;</tspan></text></g>
<text x="790" y="39" text-anchor="end" class="m tag">OPEN TO: SOFTWARE ENGINEERING INTERNSHIPS</text>
</svg>