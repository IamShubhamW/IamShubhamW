<svg xmlns="http://www.w3.org/2000/svg" width="820" height="250" viewBox="0 0 820 250" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
<linearGradient id="nm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e5a0"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
<linearGradient id="sc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e5a0" stop-opacity="0"/><stop offset="0.5" stop-color="#00e5a0" stop-opacity="0.28"/><stop offset="1" stop-color="#00e5a0" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#21262d" stroke-width="1"/></pattern>
<clipPath id="cl"><rect x="2" y="2" width="816" height="246" rx="14"/></clipPath>
</defs>
<style>
.mono{font-family:'JetBrains Mono',Consolas,'SF Mono',monospace}
.name{font-weight:800;font-size:44px;letter-spacing:3px;fill:url(#nm)}
.sub{font-size:15px;fill:#8b949e}
.p{font-size:15px;fill:#00e5a0}
.cmd{font-size:15px;fill:#e6edf3}
.tag{font-size:10px;fill:#8b949e;letter-spacing:2px;font-weight:600}
.border{fill:none;stroke:#00e5a0;stroke-width:1.5;stroke-dasharray:70 1400;animation:run 8s linear infinite}
.scan{animation:scan 5s ease-in-out infinite}
.grid{animation:drift 14s linear infinite}
.dot{animation:pulse 1.6s ease-in-out infinite}
.cover{transform-box:fill-box;transform-origin:right;animation:uncover 3.2s steps(32,end) 0.6s both}
.cur{animation:blink 1s steps(1) infinite}
@keyframes run{to{stroke-dashoffset:-1470}}
@keyframes scan{0%{transform:translateX(-300px)}100%{transform:translateX(900px)}}
@keyframes drift{to{transform:translate(32px,32px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes blink{50%{opacity:0}}
</style>
<rect x="2" y="2" width="816" height="246" rx="14" fill="url(#bg)" stroke="#30363d"/>
<g clip-path="url(#cl)">
  <rect class="grid" x="-32" y="-32" width="900" height="320" fill="url(#grid)" opacity="0.55"/>
  <rect class="scan" x="0" y="0" width="300" height="250" fill="url(#sc)"/>
</g>
<rect class="border" x="2" y="2" width="816" height="246" rx="14" pathLength="1470"/>
<circle class="dot" cx="34" cy="38" r="5" fill="#00e5a0"/>
<text x="48" y="43" class="mono tag">PUNE, IN &#183; OPEN TO INTERNSHIPS</text>
<text x="30" y="108" class="mono name">SHUBHAM WAGHMODE</text>
<text x="30" y="138" class="mono sub">cs @ vit pune. i like building things that hold up.</text>
<text x="30" y="196" class="mono p">~/shubham $</text>
<text x="136" y="196" class="mono cmd">whoami</text>
<g>
  <text x="30" y="222" class="mono cmd" fill="#00e5a0">&gt; full-stack &#183; applied ai &#183; systems</text>
  <rect class="cover" x="30" y="206" width="330" height="22" fill="#0d1117"/>
</g>
</svg>