<svg xmlns="http://www.w3.org/2000/svg" width="820" height="170" viewBox="0 0 820 170" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
<linearGradient id="sc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e5a0" stop-opacity="0"/><stop offset="0.5" stop-color="#00e5a0" stop-opacity="0.35"/><stop offset="1" stop-color="#00e5a0" stop-opacity="0"/></linearGradient>
<clipPath id="cl"><rect x="2" y="2" width="816" height="166" rx="14"/></clipPath>
</defs>
<style>
.t{font:700 24px 'JetBrains Mono',Consolas,monospace;fill:#00e5a0;letter-spacing:2px}
.d{font:400 15px 'JetBrains Mono',Consolas,monospace;fill:#c9d1d9}
.chip{font:500 11px 'JetBrains Mono',Consolas,monospace;fill:#00e5a0}
.tag{font:600 10px 'JetBrains Mono',Consolas,monospace;fill:#8b949e;letter-spacing:2px}
.border{fill:none;stroke:#00e5a0;stroke-width:1.5;stroke-dasharray:60 1200;animation:run 6s linear infinite}
.scan{animation:scan 4s ease-in-out infinite}
.dot{animation:pulse 1.6s ease-in-out infinite}
.cur{animation:blink 1s steps(1) infinite}
@keyframes run{to{stroke-dashoffset:-1260}}
@keyframes scan{0%{transform:translateX(-300px)}100%{transform:translateX(900px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes blink{50%{opacity:0}}
</style>
<rect x="2" y="2" width="816" height="166" rx="14" fill="url(#bg)" stroke="#30363d"/>
<g clip-path="url(#cl)"><rect class="scan" x="0" y="0" width="300" height="170" fill="url(#sc)"/></g>
<rect class="border" x="2" y="2" width="816" height="166" rx="14" pathLength="1260"/>
<circle class="dot" cx="34" cy="38" r="5" fill="#00e5a0"/>
<text x="48" y="43" class="tag">PRIVATE</text>
<text x="30" y="80" class="t">FLEET.AI</text>
<text x="30" y="102" class="d">Multi-agent fleet intelligence platform.<tspan class="cur" fill="#00e5a0"> ▍</tspan></text>
<g><rect x="30" y="112" rx="11" width="62" height="24" fill="#00e5a0" fill-opacity="0.12" stroke="#00e5a0" stroke-opacity="0.5"/><text x="61.0" y="128" text-anchor="middle" class="chip">React</text></g><g><rect x="102" y="112" rx="11" width="102" height="24" fill="#00e5a0" fill-opacity="0.12" stroke="#00e5a0" stroke-opacity="0.5"/><text x="153.0" y="128" text-anchor="middle" class="chip">TypeScript</text></g><g><rect x="214" y="112" rx="11" width="78" height="24" fill="#00e5a0" fill-opacity="0.12" stroke="#00e5a0" stroke-opacity="0.5"/><text x="253.0" y="128" text-anchor="middle" class="chip">FastAPI</text></g><g><rect x="302" y="112" rx="11" width="78" height="24" fill="#00e5a0" fill-opacity="0.12" stroke="#00e5a0" stroke-opacity="0.5"/><text x="341.0" y="128" text-anchor="middle" class="chip">MongoDB</text></g><g><rect x="390" y="112" rx="11" width="70" height="24" fill="#00e5a0" fill-opacity="0.12" stroke="#00e5a0" stroke-opacity="0.5"/><text x="425.0" y="128" text-anchor="middle" class="chip">Gemini</text></g>
<text x="790" y="43" text-anchor="end" class="tag">🔒 SOURCE ON REQUEST</text>
</svg>